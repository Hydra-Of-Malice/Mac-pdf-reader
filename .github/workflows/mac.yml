name: mac
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fast feedback: compile-check the Cocoa sources against the real macOS SDK.
  cocoa-syntax:
    name: Cocoa syntax (macOS SDK)
    runs-on: macos-15
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Toolchain
        run: sw_vers && xcrun --show-sdk-version && clang --version

      - name: Syntax-check Cocoa sources
        run: |
          flags=(-std=c++23 -fno-rtti -fno-exceptions -fsyntax-only -mmacosx-version-min=11.0 -DDEBUG
                 -D__GXX_TYPEINFO_EQUALITY_INLINE=1 -Isrc -Iext/djvudec -Iext/msdes -Iext/mupdf/include
                 -Iext/mupdf/generated -Wall -Wno-unused-function -Wno-unused-variable)
          status=0
          for f in $(ls src/mac/*.mm src/gui/mac/*.mm src/gui/mac/*.cpp src/mac/*.cpp 2>/dev/null | sort); do
            echo "::group::$f"
            lang=objective-c++
            case "$f" in *.cpp) lang=c++ ;; esac
            if ! clang++ -x "$lang" "${flags[@]}" "$f"; then
              echo "::error file=$f::syntax check failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # The port touches shared code; make sure the Windows debug build and unit tests still pass.
  windows:
    name: Windows regression (debug + unit tests)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build and run unit tests
        run: bun cmd/run-unit-tests.ts -dbg

  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Toolchain
        run: sw_vers && uname -m && xcrun --show-sdk-version && clang --version && bun --version

      - name: Portable core check
        run: |
          if bun cmd/build.ts -help 2>&1 | grep -q -- "-mac-core"; then
            bun cmd/build.ts -mac-core
          else
            echo "-mac-core mode not available yet; skipping"
          fi

      - name: Debug build
        run: |
          if bun cmd/build.ts -help 2>&1 | grep -q -- "-mac"; then
            bun cmd/build.ts -mac -dbg
          else
            bun -e 'import { buildMac } from "./cmd/helper/mac-build.ts"; await buildMac({ outDir: "out/mac-dbg64" });'
          fi

      # Launch the debug app with a PDF; it must still be running after 15s.
      - name: Launch smoke test
        run: |
          app=$(find out -maxdepth 3 -type d -name SumatraPDF.app | head -1)
          echo "app: $app"
          test -n "$app"
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          "$app/Contents/MacOS/SumatraPDF" "$PWD/tests/mac/fixtures/text.pdf" > "$smoke/app.log" 2>&1 &
          pid=$!
          sleep 15
          screencapture -x "$smoke/screen.png" || echo "screencapture failed"
          if kill -0 "$pid" 2>/dev/null; then
            echo "app still running after 15s"
            kill "$pid"
          else
            wait "$pid" && rc=0 || rc=$?
            echo "app exited early with code $rc"
            tail -50 "$smoke/app.log"
            exit 1
          fi
          tail -50 "$smoke/app.log"

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Release build
        run: |
          if bun cmd/build.ts -help 2>&1 | grep -q -- "-mac"; then
            bun cmd/build.ts -mac -rel
          else
            bun -e 'import { buildMac } from "./cmd/helper/mac-build.ts"; await buildMac({ outDir: "out/mac-rel64", isRelease: true });'
          fi

      - name: List outputs
        if: always()
        run: find out -maxdepth 2 \( -name "*.app" -o -name "*.tar.gz" -o -name "*.dmg" -o -name "*.zip" -o -name "test_*" \) -print 2>/dev/null || true

      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-mac-${{ matrix.arch }}
          path: |
            out/**/*.tar.gz
            out/**/*.dmg
            out/**/*.zip
          if-no-files-found: warn
          retention-days: 14
