name: mac
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Fast feedback: compile-check the Cocoa sources against the real macOS SDK.
  cocoa-syntax:
    name: Cocoa syntax (macOS SDK)
    runs-on: macos-15
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Toolchain
        run: sw_vers && xcrun --show-sdk-version && clang --version

      - name: Syntax-check Cocoa sources
        run: |
          flags=(-std=c++23 -fno-rtti -fno-exceptions -fsyntax-only -mmacosx-version-min=11.0 -DDEBUG
                 -D__GXX_TYPEINFO_EQUALITY_INLINE=1 -Isrc -Iext/djvudec -Iext/msdes -Iext/mupdf/include
                 -Iext/mupdf/generated -Wall -Wno-unused-function -Wno-unused-variable)
          status=0
          for f in $(ls src/mac/*.mm src/gui/mac/*.mm src/gui/mac/*.cpp src/mac/*.cpp 2>/dev/null | sort); do
            echo "::group::$f"
            lang=objective-c++
            case "$f" in *.cpp) lang=c++ ;; esac
            if ! clang++ -x "$lang" "${flags[@]}" "$f"; then
              echo "::error file=$f::syntax check failed"
              status=1
            fi
            echo "::endgroup::"
          done
          exit $status

  # The port touches shared code; make sure the Windows debug build and unit tests still pass.
  windows:
    name: Windows regression (debug + unit tests)
    runs-on: windows-2025-vs2026
    timeout-minutes: 60
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build and run unit tests
        run: bun cmd/run-unit-tests.ts -dbg

  build:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Check out source code
        uses: actions/checkout@v5

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Toolchain
        run: sw_vers && uname -m && xcrun --show-sdk-version && clang --version && bun --version

      - name: Portable core check (engines + unit tests)
        id: core
        run: bun cmd/build.ts -mac-core

      # Per-format engine tests through the same bridge the app uses; reported, not gating.
      - name: Format test matrix
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun tests/mac/run-engine-tests.ts --driver out/mac-core-dbg-clang/test_mac_engine --json out/mac-engine-results.json

      # Mutated fixtures (truncated, bit flips, damaged headers) must not crash or hang the engines: a small fixed
      # subset; reproducers land in tests/tmp/mac-fuzz/repro. Reported, not gating.
      - name: Fuzz subset
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun tests/mac/fuzz-engine.ts --driver out/mac-core-dbg-clang/test_mac_engine --ci

      # Dark mode (MacSetDocColors): Smart Dark and Inverted on a subset of the formats (manifest "dark" entries):
      # pages, kept photos, stale renders after a colors switch, thumbnails. Reported, not gating yet.
      - name: Dark mode matrix
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: >-
          bun tests/mac/run-engine-tests.ts --driver out/mac-core-dbg-clang/test_mac_engine --dark-only
          --json out/mac-engine-dark-results.json

      - name: Fuzz subset (Smart Dark)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: bun tests/mac/fuzz-engine.ts --driver out/mac-core-dbg-clang/test_mac_engine --ci --colors smart

      - name: Debug build
        id: debug
        if: ${{ !cancelled() }}
        run: bun cmd/build.ts -mac -dbg

      # Launch the debug app with a PDF; it must still be running after 15s.
      - name: Launch smoke test
        if: ${{ !cancelled() && steps.debug.outcome == 'success' }}
        run: |
          app=$(find out -maxdepth 3 -type d -name SumatraPDF.app | head -1)
          echo "app: $app"
          test -n "$app"
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          "$app/Contents/MacOS/SumatraPDF" "$PWD/tests/mac/fixtures/text.pdf" > "$smoke/app.log" 2>&1 &
          pid=$!
          sleep 15
          screencapture -x "$smoke/screen.png" || echo "screencapture failed"
          if kill -0 "$pid" 2>/dev/null; then
            echo "app still running after 15s"
            kill "$pid"
          else
            wait "$pid" && rc=0 || rc=$?
            echo "app exited early with code $rc"
            tail -50 "$smoke/app.log"
            exit 1
          fi
          tail -50 "$smoke/app.log"

      # The same straight into dark mode (dark appearance, Smart Dark pages); the screenshot is uploaded with the
      # smoke results for a visual check.
      - name: Dark launch smoke test
        if: ${{ !cancelled() && steps.debug.outcome == 'success' }}
        run: |
          app=$(find out -maxdepth 3 -type d -name SumatraPDF.app | head -1)
          test -n "$app"
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          "$app/Contents/MacOS/SumatraPDF" -for-testing -appearance dark -doc-colors smart \
            "$PWD/tests/mac/fixtures/text.pdf" > "$smoke/app-dark.log" 2>&1 &
          pid=$!
          sleep 15
          screencapture -x "$smoke/screen-dark.png" || echo "screencapture failed"
          if kill -0 "$pid" 2>/dev/null; then
            echo "app still running after 15s"
            kill "$pid"
          else
            wait "$pid" && rc=0 || rc=$?
            echo "app exited early with code $rc"
            tail -50 "$smoke/app-dark.log"
            exit 1
          fi
          tail -50 "$smoke/app-dark.log"

      - name: Upload smoke test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: ignore
          retention-days: 14

      - name: Release build
        if: ${{ !cancelled() }}
        run: bun cmd/build.ts -mac -rel

      - name: List outputs
        if: always()
        run: find out -maxdepth 2 \( -name "*.app" -o -name "*.tar.gz" -o -name "*.dmg" -o -name "*.zip" -o -name "test_*" \) -print 2>/dev/null || true

      - name: Upload app
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SumatraPDF-mac-${{ matrix.arch }}
          path: |
            out/mac-engine-results.json
            out/mac-engine-dark-results.json
            tests/tmp/mac-fuzz/repro
            out/**/*.tar.gz
            out/**/*.dmg
            out/**/*.zip
          if-no-files-found: warn
          retention-days: 14

      # The debug app's built-in self-test (src/mac/MacSelfTest.mm): opens every manifest fixture the way Finder
      # does, drives menus, find, sidebar, links, copy, print and close/reopen, snapshots pages. Gating; last, so
      # the builds above are uploaded even when it fails.
      - name: App self-test
        if: ${{ !cancelled() && steps.debug.outcome == 'success' }}
        timeout-minutes: 40
        run: |
          app=$(find out -maxdepth 3 -type d -name SumatraPDF.app -path "*dbg*" | head -1)
          if [ -z "$app" ]; then app=$(find out -maxdepth 3 -type d -name SumatraPDF.app | head -1); fi
          echo "app: $app"
          test -n "$app"
          out="$RUNNER_TEMP/selftest"
          mkdir -p "$out/prefs"
          bun -e 'import { makeLargePdf } from "./tests/mac/fixture-lib.ts"; import { mkdirSync, writeFileSync } from "node:fs"; mkdirSync("tests/tmp/mac-fixtures", { recursive: true }); writeFileSync("tests/tmp/mac-fixtures/large-2000.pdf", makeLargePdf(2000));' || echo "large-2000.pdf not generated; that case is skipped"
          rc=0
          "$app/Contents/MacOS/SumatraPDF" -for-testing -prefs-dir "$out/prefs" -self-test "$out/report.json" \
            -self-test-manifest tests/mac/fixtures/manifest.json -self-test-timeout 2100 > "$out/app.log" 2>&1 || rc=$?
          echo "app exit code: $rc"
          grep -E "^selftest: " "$out/app.log" | grep -v "^selftest:   ok" || true
          if [ ! -f "$out/report.json" ]; then
            echo "::error title=self-test::no report written"
            tail -100 "$out/app.log"
            exit 1
          fi
          # known failures (space-separated case ids, tracked elsewhere) are reported but don't fail the step
          python3 - "$out/report.json" "$rc" "" <<'EOF'
          import json, sys
          r = json.load(open(sys.argv[1], encoding="utf-8"))
          rc = int(sys.argv[2])
          known = set(sys.argv[3].split())
          unexpected = []
          for f in r.get("files", []):
              fid = f.get("id", "")
              ok = f.get("pass")
              status = "SKIP" if f.get("skipped") else ("PASS" if ok else ("KNOWN" if fid in known else "FAIL"))
              print(f"{status:<5}  {fid:<26} {f.get('ms', 0):>8.0f} ms  {f.get('path', '')}")
              if ok:
                  continue
              if fid not in known:
                  unexpected.append(fid)
              level = "warning" if fid in known else "error"
              for s in f.get("steps", []):
                  if not s.get("ok"):
                      print(f"      FAIL {s.get('name')}: {s.get('detail', '')}")
                      print(f"::{level} title=self-test {fid}::{s.get('name')}: {s.get('detail', '')}")
              for a in f.get("alerts", []):
                  print(f"      alert: {a}")
          print(f"finished={r.get('finished')} pass={r.get('pass')} cases={r.get('cases')} "
                f"failed={r.get('failed')} skipped={r.get('skipped')} ms={r.get('ms')} app exit code={rc}")
          if r.get("error"):
              print(f"::error title=self-test::{r['error']}")
          # 0 pass, 1 test failures (judged above); anything else is a crash or the watchdog
          good = r.get("finished") and not r.get("error") and not unexpected and rc in (0, 1)
          if unexpected:
              print("unexpected failures: " + " ".join(unexpected))
          sys.exit(0 if good else 1)
          EOF

      - name: Upload self-test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-${{ matrix.arch }}
          path: ${{ runner.temp }}/selftest
          if-no-files-found: ignore
          retention-days: 14
